<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tree</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mut:#6b6a66;--line:#dcd9d0;--card:#fff;--acc:#2b5d9c;--ok:#2e7d32;--bad:#b3261e;--sel:#eef3fa}
@media(prefers-color-scheme:dark){:root{--bg:#15161a;--fg:#e8e6e1;--mut:#9a988f;--line:#2c2e35;--card:#1d1f25;--acc:#7fa8e0;--ok:#7bc47f;--bad:#f28b82;--sel:#232a36}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:14px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--card)}
header a{color:var(--fg);text-decoration:none;font-weight:600}header small{color:var(--mut)}header .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:16px 18px}
h1{font-size:20px;margin:0}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.mut{color:var(--mut)}a{color:var(--acc)}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:0;background:none;color:var(--fg);padding:3px 9px;cursor:pointer;font:inherit}
.seg button.on-accepted{background:var(--ok);color:#fff}.seg button.on-rejected{background:var(--bad);color:#fff}.seg button.on-undecided{background:var(--line)}
pre.card-text{white-space:pre-wrap;font-size:12px;margin:4px 0 6px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:4px}.st{display:inline-block;min-width:58px;font-size:12px;color:var(--mut)}.st.held{color:var(--ok);font-weight:600}.st.cited{color:var(--acc)}.st.missing{color:var(--fg)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--sel)}tr.row.on td{background:var(--sel)}
input[type=text],input[type=search]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.fx{display:flex;gap:16px;align-items:flex-start}.fx>*{flex:1;min-width:0}
details summary{cursor:pointer;color:var(--mut);margin:8px 0}
.q{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}.q b{font-weight:600}.q .sp{flex:1}
#results{position:sticky;top:12px}#results .card{min-height:120px}
.pill{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mut);margin-left:4px}
.list td:first-child{width:38%}
.gen{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}.gen+.gen{border-top:1px dashed var(--line);padding-top:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:190px;max-width:240px;text-decoration:none;color:var(--fg);display:block}
.pc:hover{border-color:var(--acc)}.pc b{display:block;font-weight:600}.pc .yrs{color:var(--mut);font-size:12px}.pc .w{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:12px;padding:0 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}.badge.doc{background:var(--acc);color:#fff;border-color:var(--acc)}.badge.run{border-color:var(--ok);color:var(--ok)}.badge.conf{border-color:var(--bad);color:var(--bad)}
.pc.done{opacity:.75}.gen-label{width:100%;text-align:center;color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.reason{display:inline-flex;gap:6px;margin-left:6px}.reason input{width:260px}
.doc{margin-bottom:10px}.doc-head{margin-bottom:4px}.doc-fields td,.doc-fields th{padding:2px 10px 2px 0;border:0;font-size:13px}.doc-fields th{font-size:11px}
.v{font-size:12px;padding:0 6px;border-radius:10px;border:1px solid var(--line)}.v.agrees,.v.accepted{color:var(--ok);border-color:var(--ok)}.v.disagrees,.v.rejected{color:var(--bad);border-color:var(--bad)}.v.absent,.v.undecided{color:var(--mut)}
#rc>div{margin:6px 0}
.fields td{padding:2px 8px 2px 0;border:0;font-size:13px}.fields input[type=text]{padding:2px 6px;width:100%}
</style></head><body>
<header><a href="/">Tree</a><small id="tree"></small><span class="sp"></span><small id="who"></small></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s), h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS=['name','sex','birth','death','parents','spouses','children'];
let P=null, SEL=null;
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const post=(p,body)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
function fmt(v){if(v==null)return '—';if(Array.isArray(v))return v.length?v.map(x=>typeof x==='object'?[x.year,x.place].filter(Boolean).join(' '):x).join('; '):'—';if(typeof v==='object')return [v.date||v.year,v.place].filter(Boolean).join(', ');return v}
async function boot(){const t=await api('/api/tree');$('#tree').textContent=t.name;$('#who').textContent='acting as '+t.by;
 const m=location.pathname.match(/^\/person\/([A-Z0-9]+)/);m?person(m[1]):overview()}
function badges(c){const b=[];if(c.documents)b.push(`<span class="badge doc">${c.documents} document${c.documents>1?'s':''} to decide</span>`);
 if(c.runs_next)b.push(`<span class="badge run">${c.runs_next} run${c.runs_next>1?'':'s'} on their own</span>`);if(c.needs_hand&&c.accepted)b.push(`<span class="badge">${c.needs_hand} need${c.needs_hand>1?'':'s'} a hand</span>`);
 if(c.conflicts)b.push(`<span class="badge conf">${c.conflicts} conflict${c.conflicts>1?'s':''}</span>`);if(c.editable_only)b.push(`<span class="badge conf">rests on sources anyone can edit</span>`);return b.join('')}
function cardHtml(c){const done=c.accepted===c.key_facts&&!c.documents&&!c.conflicts;
 return `<a class="pc${done?' done':''}" href="/person/${c.id}"><b>${h(c.name)}</b><span class="yrs">${c.span[0]??'?'}–${c.span[1]??''} · ${c.accepted} of ${c.key_facts} key facts</span><span class="w">${badges(c)||(done?'<span class="badge">nothing waiting</span>':'')}</span></a>`}
async function overview(){const o=await api('/api/overview');const labels=['you','parents','grandparents','great-grandparents','great-great-grandparents','5th generation back','6th generation back','7th generation back'];
 let html=`<h1>The family</h1><p class="mut">Each card is a person, you first and your ancestors above you by generation. A badge says what waits on them: documents to decide, steps that run on their own or need a hand, conflicts. A person the file names but nobody has looked at yet carries no badge until a document about them arrives. Open a card to decide.</p>`;
 if(!o.home)html+=`<p>No home person set: <code>tools/tree.py home "&lt;person&gt;"</code>.</p>`;
 o.generations.forEach((g,gi)=>{html+=`<div class="gen"><div class="gen-label">${labels[gi]||gi+' generations back'}</div>${g.map(cardHtml).join('')}</div>`});
 const waiting=o.others.filter(c=>c.documents||c.conflicts), rest=o.others.filter(c=>!c.documents&&!c.conflicts);
 if(waiting.length)html+=`<h2>Others with something waiting</h2><div class="gen" style="justify-content:flex-start">${waiting.map(cardHtml).join('')}</div>`;
 html+=`<details><summary>Everyone else in the file (${rest.length})</summary><p><input type="search" id="q" placeholder="name"></p><div id="rest" class="gen" style="justify-content:flex-start">${rest.map(cardHtml).join('')}</div></details>`;
 $('#main').innerHTML=html;$('#q').oninput=e=>{const q=e.target.value.toLowerCase();$('#rest').innerHTML=rest.filter(c=>c.name.toLowerCase().includes(q)).map(cardHtml).join('')}}
async function list(q=''){const rows=await api('/api/people?q='+encodeURIComponent(q));
 $('#main').innerHTML=`<h1>People</h1><p class="mut">Open a person. Nothing is searched until their key facts are reviewed.</p>
 <p><input type="search" id="q" placeholder="name" value="${h(q)}"></p>
 <table class="list"><tr><th>person</th><th>years</th><th>key facts accepted</th><th>household records missing</th><th>cited, not held</th><th>questions</th></tr>
 ${rows.map(r=>`<tr><td><a href="/person/${r.id}">${h(r.name)}</a></td><td>${r.span[0]??''}–${r.span[1]??''}</td><td>${r.accepted} of ${r.key_facts}</td><td>${r.gaps}</td><td>${r.to_fetch}</td><td>${r.questions}</td></tr>`).join('')}</table>`;
 $('#q').oninput=e=>{clearTimeout(window._t);window._t=setTimeout(()=>list(e.target.value),250)};$('#q').focus()}
async function person(id){P=await api('/api/person/'+id);render()}
async function reload(){P=await api('/api/person/'+P.person.id);render();if(SEL)show(SEL.grp,SEL.i)}
function verdict(v){return `<span class="v ${v}">${v}</span>`}
function docHtml(c){const r=c.record;const id=c.id;
 const fields=c.fields.length?`<table class="fields doc-fields"><tr><th></th><th>record says</th><th>tree says</th><th></th></tr>${c.fields.map(f=>`<tr><td><b>${h(f.field)}</b></td><td>${h(f.record??'—')}</td><td class="mut">${h(f.tree??'—')}</td><td>${verdict(f.verdict)}${f.note?` <span class="mut">${h(f.note)}</span>`:''}</td></tr>`).join('')}</table>`:`<div class="mut">the record states nothing beyond the name</div>`;
 const rels=c.relationships.length?`<div class="mut" style="margin-top:6px">${c.relationships.map(x=>`${x.direction==='is'?`${h(x.as_written||x.kind)} of ${h(x.other)}`:`${h(x.other)} listed under ${h(x.as_written||x.kind)}`} <span class="pill">${h(x.other_status)}</span>`).join(' · ')}</div>`:'';
 const closes=c.closes.length?`<div style="margin-top:6px"><span class="mut">Adding it: </span>${c.closes.map(h).join('; ')}</div>`:'';
 const oddList=(c.odd||[]).filter(x=>x&&x!=='nothing');const odd=oddList.length?`<div style="margin-top:4px;color:var(--bad)">${oddList.map(h).join('; ')}</div>`:'';
 return `<div class="card doc" id="doc-${id}"><div class="doc-head"><b>${h(c.highlight)}</b></div>
  <div class="mut">${h(r.holder||r.holder_id||'')}${r.collection?` · ${h(r.collection)}`:''}${r.identity.length?` · ${h(r.identity.join(', '))}`:''} <span class="pill">${h(r.tier||'')}</span>${r.page?` · <a href="${r.page}" target="_blank" rel="noopener">the holder's page</a>`:''}</div>
  ${c.person?`<div class="mut">the tree's claim: ${h(claimText(c.person.claim))}</div>`:c.subject?`<div class="mut">nobody in the tree yet; the record is about the family of ${h(c.subject)}</div>`:''}
  ${fields}${rels}${closes}${odd}
  <div style="margin-top:8px"><span class="seg"><button class="on-accepted" onclick="decideProposal('${id}','accepted')">Add</button><button onclick="ignore('${id}')">Ignore</button></span><span id="ig-${id}"></span></div></div>`}
function claimText(cl){const f=(d)=>d&&(d.date||d.place)?[d.date,d.place].filter(Boolean).join(', '):null;return [f(cl.birth)?'born '+f(cl.birth):null,f(cl.death)?'died '+f(cl.death):null,f(cl.burial)?'buried '+f(cl.burial):null].filter(Boolean).join('; ')||'no dates'}
function evidenceHtml(ev){const records=ev.filter(e=>e.held&&!e.uncited&&!e.vouched&&e.tier!=='T4'), vouched=ev.filter(e=>e.vouched), file=ev.filter(e=>(e.uncited||e.tier==='T4')&&!e.vouched);
 const groups={};for(const e of records){const k=(e.citation||'').split(';')[0]+(e.ident?', '+e.ident:'');(groups[k]=groups[k]||{tier:e.tier,statuses:new Set()}).statuses.add(e.status)}
 const parts=Object.entries(groups).map(([k,g])=>{const st=g.statuses.has('accepted')?'accepted':g.statuses.has('rejected')&&g.statuses.size===1?'rejected':'undecided';return `<div>${h(k)} ${g.tier?`<span class="pill">${g.tier}</span>`:''} <span class="v ${st}">${st}</span></div>`});
 if(vouched.length)parts.push(`<div class="mut">your own knowledge <span class="v accepted">accepted</span></div>`);
 if(file.length)parts.push(`<div class="mut">the file's claim${file.length>1?'s':''} (${file.length}) <span class="pill">${file.some(e=>e.status==='accepted')?'accepted':'undecided'}</span></div>`);
 return parts.join('')||'<span class="mut">no evidence</span>'}
function render(){const p=P.person, rv=P.review, fam=P.family, F=Object.fromEntries(P.foundation.map(f=>[f.field,f]));
 const link=x=>`<a href="/person/${x.id}">${h(x.name)}</a>`;
 const acc=KEYS.filter(k=>rv[k].status==='accepted').length;
 let html=`<h1>${h(p.name)} <span class="mut" style="font-weight:400">${p.span[0]??'?'}–${p.span[1]??'?'}</span></h1>
 <p class="mut">parents: ${fam.parents.map(link).join(', ')||'—'} · spouse: ${fam.spouses.map(link).join(', ')||'—'} · children: ${fam.children.map(link).join(', ')||'—'}${fam.siblings.length?' · siblings: '+fam.siblings.map(link).join(', '):''}</p>`;
 const bl=P.baseline;
 html+=`<p><b>${acc} of ${KEYS.length}</b> key facts accepted ${badges({...P.waiting,accepted:acc})}${bl.complete?'':` <span class="mut">— ${bl.undecided.join(', ')} still undecided; searches, the family footprint and leads open when every key fact is decided; fetching cited records is open now</span>`}${p.notes.map(n=>` <span class="pill">${h(n)}</span>`).join('')}</p>`;
 html+=`<h2>Documents to decide</h2>`;
 if(P.documents.length){html+=`<p class="mut">Each is one decision: is this record about this person? Add takes everything it states; Ignore keeps your reason for later searches.</p>`+P.documents.map(docHtml).join('')}
 else html+=`<div class="card mut">No document waits on this person.${P.waiting.runs_next?` ${P.waiting.runs_next} step${P.waiting.runs_next>1?'s':''} run${P.waiting.runs_next>1?'':'s'} on their own next.`:''}${P.waiting.needs_hand?` ${P.waiting.needs_hand} need${P.waiting.needs_hand>1?'':'s'} a hand in the browser.`:''}</div>`;
 for(const c of (P.candidates||[]))html+=`<div class="card"><pre class="card-text">${h(c.text)}</pre></div>`;
 html+=`<div id="rc"></div>
 <h2>What is known</h2><div class="card"><table>
 <tr><th>fact</th><th>value</th><th>from</th><th>decision</th></tr>`;
 for(const k of KEYS){const f=F[k]||{};const ev=rv[k].evidence;const st=rv[k].status;
  const seg=st===null?'<span class="mut">no claim</span>':['accepted','rejected','undecided'].map(s=>`<button class="${st===s?'on-'+s:''}" onclick="decide('${k}','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('');
  html+=`<tr><td><b>${k}</b></td><td>${h(fmt(f.value))}${f.variants&&f.variants.length?`<div class="mut">variants: ${h(f.variants.join(', '))}</div>`:''}</td><td>${evidenceHtml(ev)}</td><td><span class="seg">${seg}</span></td></tr>`}
 for(const f of (P.facts||[])){const st=f.status;
  const seg=st===null?'':['accepted','rejected','undecided'].map(s=>`<button class="${st===s?'on-'+s:''}" onclick="decide('${f.field}','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('');
  html+=`<tr><td>${h(f.type.toLowerCase())}</td><td>${h([f.date,f.place,f.value].filter(Boolean).join(' · '))||'—'}</td><td>${evidenceHtml(f.evidence)}</td><td><span class="seg">${seg}</span></td></tr>`}
 html+=`</table><div class="mut" style="margin-top:6px">A fact's status comes from the documents accepted about the person. The buttons are for your own knowledge when no record is held, and for undoing a single claim.</div></div>`;
 const plan=P.plan||{questions:[],steps:[]}; const nf=plan.steps.filter(s=>s.kind==='fetch').length, ns=plan.steps.length-nf;
 html+=`<h2>What the plan does next</h2><div class="card">`;
 if(!plan.questions.length&&!plan.steps.length)html+=`<span class="mut">No plan yet.</span> <button onclick="makePlan()">Generate plan from the checklist</button>`;
 else{html+=`<div class="mut">${plan.questions.length} open question(s); ${nf} fetch step(s) and ${ns} search step(s) on the rows below. <button onclick="makePlan()">Refresh plan</button></div>`;
  for(const q of plan.questions){html+=`<div class="q"><b>${h(q.kind.replace(/_/g,' '))}</b> <span class="mut">${h(q.detail.detail||'')}</span>${q.steps?` <span class="pill">${q.steps} steps</span>`:''}<span class="sp"></span><button onclick="dismiss('${q.id}')">Dismiss</button></div>`}}
 html+=`</div>`;
 html+=`<div class="fx"><div><h2>Records that should exist</h2>`;
 const fp=P.footprint;
 if(fp.records.length){html+=`<div class="card"><div class="mut">Already on this family — fetch first (${fp.summary.records} records on ${fp.summary.relatives} relatives)</div><table>`;
  fp.records.slice(0,8).forEach((r,i)=>{html+=`<tr class="row" data-grp="fp" data-i="${i}" onclick="show('fp',${i})"><td>${h(r.collection)}</td><td class="mut">on ${h(r.on.map(x=>x[0]+' ('+x[1]+')').join(', '))}</td></tr>`});
  if(fp.records.length>8)html+=`<tr><td colspan="2" class="mut">… ${fp.records.length-8} more</td></tr>`;html+=`</table></div>`}
 const rowsHtml=(grp)=>P.checklist[grp].map((r,i)=>`<tr class="row" data-grp="${grp}" data-i="${i}" onclick="show('${grp}',${i})"><td><span class="st ${r.status}">${r.status}</span></td><td>${h(r.record)}${r.instance?' '+h(r.instance):''}${r.via?` <span class="mut">on ${h(r.via)}</span>`:''}</td><td class="mut">${h(r.sources.join(', '))}</td></tr>`).join('');
 html+=`<div class="card" style="margin-top:10px"><div class="mut">A. Records that hold several family members</div><table>${rowsHtml('A')}</table>
 <details><summary>B. Records about this person only (${P.checklist.B.length})</summary><table>${rowsHtml('B')}</table></details></div></div>
 <div id="results"><h2>Selected</h2><div class="card" id="rc2"><span class="mut">Click a record row to see its step, the record held, or the citations behind it.</span></div></div></div>`;
 if(P.decided.length)html+=`<details><summary>Documents decided (${P.decided.length})</summary><div class="card">${P.decided.map(d=>`<div class="q"><span class="v ${d.status==='accepted'?'agrees':'disagrees'}">${d.status}</span> <b>${h(d.persona)}</b> <span class="mut">${h(d.role||'')} on ${h(d.record||'')}${d.by_rule?' · by rule':''}${d.note?' · '+h(d.note):''}</span><span class="sp"></span>${d.by_rule&&d.status==='accepted'?`<span class="seg"><button onclick="ignore('${d.id}')">Set aside</button></span><span id="ig-${d.id}"></span>`:''}</div>`).join('')}</div></details>`;
 $('#main').innerHTML=html}
function stepsFor(grp,i){const steps=(P.plan||{steps:[]}).steps;
 if(grp==='fp'){const r=P.footprint.records[i];return steps.filter(s=>s.kind==='fetch'&&s.locator.value===r.apid)}
 const r=P.checklist[grp][i];const key=`${r.record}:${r.instance||''}`;return steps.filter(s=>s.row_key===key)}
function fieldsHtml(s){if(s.kind==='fetch'){const rows=Object.entries(s.fields).filter(([k])=>k!=='url').map(([k,v])=>`<tr><td><b>${h(k)}</b></td><td class="mut">${h(v.value)}</td></tr>`).join('');
  return rows?`<div class="mut" style="margin-top:6px">Look for (the citation's own details):</div><table class="fields">${rows}</table>`:''}
 const rows=Object.entries(s.fields).map(([k,v])=>{const r=s.revisions[k]||{};const inc=r.include===false?'':'checked';
  const val=v&&typeof v==='object'&&'value' in v?v.value:v, basis=v&&typeof v==='object'&&v.basis?v.basis:'';
  return `<tr><td><input type="checkbox" ${inc} onchange="revise('${s.id}','${k}','include',this.checked)"></td><td><b>${h(k)}</b></td><td class="mut">${h(Array.isArray(val)||(val&&typeof val==='object')?JSON.stringify(val):val)}${v&&v.tolerance?' ±'+v.tolerance:''}${basis?` <span class="pill">${h(basis)}</span>`:''}</td><td><input type="text" placeholder="revise for search" value="${h(r.value||'')}" onchange="revise('${s.id}','${k}','value',this.value)"></td></tr>`}).join('');
 return `<div class="mut" style="margin-top:6px">Fields for this search (untick to leave a fact out, revise a spelling or range; the log records exactly these):</div><table class="fields">${rows}</table>`}
function stepsHtml(steps){if(!steps.length)return `<div class="mut">No plan step for this row yet — generate or refresh the plan above.</div>`;return steps.map(stepHtml).join('<hr style="border:0;border-top:1px solid var(--line)">')}
function stepHtml(s){
 const logs=s.logs.length?`<div class="mut">Log:</div>`+s.logs.map(l=>`<div>${h(l.executed_at.slice(0,10))} <b>${h(l.outcome)}</b> <span class="mut">${h(l.executed_by)} ${h(l.notes||'')}</span>${l.artifacts_json?' <span class="pill">archived</span>':''}</div>`).join(''):'<div class="mut">Not tried yet.</div>';
 const where=s.kind==='fetch'?`<div>${h(s.collection||'')}${s.on.length?` <span class="mut">on ${h(s.on.map(x=>x[0]+' ('+x[1]+')').join(', '))}</span>`:''}${s.url?` <a href="${s.url}" target="_blank">open at ${h(s.holder)} ↗</a> <span class="mut">${s.mode==='blocked'?'(needs a membership)':'(the holder\'s search, prefilled from the citation) then save the record page and its image into inbox/'}</span>`:''}</div>`:`<div class="mut">sources: ${h(s.sources.join(', '))}${s.url?` <a href="${s.url}" target="_blank">open at ${h(s.holder)} ↗</a> <span class="mut">(the site's own search, built from the foundation) then save the results page into inbox/</span>`:''}</div>`;
 return `<p><b>${s.kind==='fetch'?'Fetch':'Search'}</b> <span class="pill">${h(s.mode)}</span> <span class="pill">${h(s.type)}</span> <span class="pill">${h(s.status)}</span> <span class="mut">${h(s.rationale||'')}</span></p>${where}${s.expected?`<div class="mut">Expected: ${h(s.expected)}</div>`:''}${fieldsHtml(s)}${logs}
 <div style="margin-top:8px"><input type="text" id="ln-${s.id}" placeholder="note (what was searched, where)" style="width:100%"></div>
 <div style="margin-top:6px"><button onclick="logStep('${s.id}','none')">Nothing found</button> <button onclick="logStep('${s.id}','blocked')">Blocked</button>
 <span style="margin-left:10px">Found: <select id="lf-${s.id}" class="lfile"><option value="">— file in inbox —</option></select> <button onclick="inbox()">refresh</button> <button onclick="logStep('${s.id}','found')">Archive + log</button></span></div>`}
function show(grp,i){SEL={grp,i};document.querySelectorAll('tr.row').forEach(e=>e.classList.toggle('on',e.dataset.grp===grp&&e.dataset.i==String(i)));
 const rc=$('#rc2');const steps=stepsFor(grp,i);
 if(grp==='fp'){const r=P.footprint.records[i];rc.innerHTML=`<b>${h(r.collection)}</b><div class="mut">on ${h(r.on.map(x=>x[0]+' ('+x[1]+')').join(', '))}</div><p>Expected: ${h(r.expect)}</p>${r.held?'<p class="mut">held in the archive</p>':''}`+stepsHtml(steps);inbox();records(steps);return}
 const r=P.checklist[grp][i];let html=`<b>${h(r.record)}${r.instance?' '+h(r.instance):''}</b> <span class="st ${r.status}">${r.status}</span>${r.note?`<div class="mut">${h(r.note)}</div>`:''}<p>Settles: ${h(r.settles)}</p>`;
 if(r.citations&&r.citations.length&&!steps.length){html+=`<div class="mut">Cited:</div>`+r.citations.map(c=>`<div>${h(c.collection)}${c.on.length?` <span class="mut">on ${h(c.on.map(x=>x[0]).join(', '))}</span>`:''}${c.url?` <a href="${c.url}" target="_blank">open at ${h(c.holder)} ↗</a>`:''}${c.held?' <span class="pill">held</span>':''}</div>`).join('')}
 if(r.status==='missing'&&!r.search)html+=`<div class="mut">Search steps for missing records come after the baseline is reviewed.</div>`;
 if(steps.some(s=>s.kind==='search'))html+=`<div class="mut">Automatic sources are not wired yet; for assisted sources open the source, search with the fields below, and log the result here.</div>`;
 rc.innerHTML=html+stepsHtml(steps);inbox();records(steps,r)}
function shasOf(steps,row){const out=[];for(const s of steps){if(s.archived&&!out.includes(s.archived))out.push(s.archived);for(const l of s.logs){for(const sha of JSON.parse(l.artifacts_json||'[]'))if(!out.includes(sha))out.push(sha)}}
 for(const c of (row&&row.citations)||[]){if(c.sha256&&!out.includes(c.sha256))out.push(c.sha256)}return out}
async function records(steps,row){const shas=shasOf(steps,row);if(!shas.length)return;const box=document.createElement('div');box.id='records';$('#rc2').appendChild(box);
 for(const sha of shas){const a=await api('/api/artifact/'+sha+'?person='+P.person.id);if(!a.error)box.insertAdjacentHTML('beforeend',recordHtml(a))}}
function factLine(f){return `${h(f.type)}: ${h([f.value,f.date,f.place].filter(Boolean).join(' · '))}`}
function recordHtml(a){const id=a.sha256.slice(0,12);
 let html=`<hr style="border:0;border-top:1px solid var(--line)"><p><b>Record held</b> ${h(a.filename||'')} ${a.tier?`<span class="pill">${h(a.tier)}</span>`:''}${a.collection?` <span class="mut">${h(a.collection)}</span>`:''}${a.url?` <a href="${a.url}" target="_blank">↗</a>`:''}</p>`;
 if(a.candidates_text)html+=`<pre class="card-text">${h(a.candidates_text)}</pre>`;
 for(const e of a.extractions){html+=`<div class="mut">Extraction by ${h(e.extractor)}</div>`;
  for(const p of e.personas){const props=(a.proposals||[]).filter(x=>x.persona_id===p.id);
   html+=`<div style="margin:4px 0 8px 10px"><b>${h(p.name)}</b> <span class="mut">${h([p.role,p.sex].filter(Boolean).join(', '))}</span>${p.link?` <span class="pill">${h(p.link)} for this person</span>`:''}
   ${p.facts.map(f=>`<div class="mut" style="font-size:12px">${factLine(f)}</div>`).join('')}${p.relations.map(r=>`<div class="mut" style="font-size:12px">${h(r.kind)} of ${h(r.other)}${r.text?` (${h(r.text)})`:''}</div>`).join('')}
   ${props.map(x=>`<div style="margin-top:4px"><span class="pill">${h(x.kind.replace('_',' '))}${x.person?': '+h(x.person):''}</span> <span class="pill">${h(x.status)}${x.by_rule?' by rule':''}</span>${x.note?` <span class="mut">${h(x.note)}</span>`:''}${x.by_rule&&x.status==='accepted'?` <span class="seg"><button onclick="ignore('${x.id}')">Set aside</button></span><span id="ig-${x.id}"></span>`:''}${x.status==='undecided'?` <span class="seg"><button onclick="decideProposal('${x.id}','accepted')">Add</button><button onclick="ignore('${x.id}')">Ignore</button></span><span id="ig-${x.id}"></span>`:''}${x.card_text?`<pre class="card-text">${h(x.card_text)}</pre>`:` ${h(x.rationale)}`}</div>`).join('')}</div>`}}
 if(!a.personas_on_record.length)html+=`<div class="mut">No persona on this record yet${a.mime.startsWith('image/')?' (an image is transcribed by hand)':''}. Transcribe one person at a time:</div>`;
 const opts=a.personas_on_record.map(p=>`<option value="${p.id}">${h(p.name)}</option>`).join('');
 html+=`<details ${a.personas_on_record.length?'':'open'}><summary>Transcribe a person from this record</summary><table class="fields">
  ${[['name','name'],['role','role in the record (head, wife, son, deceased, informant)'],['age','age'],['birth_date','birth date'],['birth_place','birth place'],['death_date','death date'],['death_place','death place'],['residence','residence']].map(([k,l])=>`<tr><td><b>${l}</b></td><td><input type="text" id="tr-${id}-${k}"></td></tr>`).join('')}
  <tr><td><b>sex</b></td><td><select id="tr-${id}-sex"><option value="">—</option><option>M</option><option>F</option></select></td></tr>
  ${opts?`<tr><td><b>relation</b></td><td><select id="tr-${id}-rk"><option value="">—</option>${['spouse','parent','child','sibling','head','boarder','informant','other'].map(k=>`<option>${k}</option>`).join('')}</select> of <select id="tr-${id}-rp">${opts}</select> <input type="text" id="tr-${id}-rt" placeholder="as written" style="width:40%"></td></tr>`:''}
  </table><button onclick="transcribe('${a.sha256}')">Add persona</button></details>`;
 return html}
function ignore(id){$('#ig-'+id).innerHTML=`<span class="reason"><input type="text" id="igr-${id}" placeholder="why it is set aside; kept for later searches"><button onclick="decideProposal('${id}','rejected',$('#igr-${id}').value)">Set aside</button></span>`;$('#igr-'+id).focus()}
async function decideProposal(id,status,note){const r=await post('/api/proposal/'+id+'/decide',{status,note});if(r.error){fail(r.error);return}await reload();
 if(r.summary)$('#rc').insertAdjacentHTML('afterbegin',`<div style="color:var(--ok)">${h(r.summary)}</div>`)}
async function transcribe(sha){const id=sha.slice(0,12);const v=k=>$('#tr-'+id+'-'+k)?.value||'';
 const body={name:v('name'),role:v('role'),sex:v('sex'),age:v('age'),birth_date:v('birth_date'),birth_place:v('birth_place'),death_date:v('death_date'),death_place:v('death_place'),residence:v('residence'),relations:v('rk')?[{kind:v('rk'),persona_id:v('rp'),text:v('rt')}]:[]};
 const r=await post('/api/artifact/'+sha+'/persona',body);if(r.error){fail(r.error);return}await reload()}
async function inbox(){const els=document.querySelectorAll('select.lfile');if(!els.length)return;const f=await api('/api/inbox');els.forEach(el=>{el.innerHTML='<option value="">— file in inbox —</option>'+f.map(x=>`<option>${h(x)}</option>`).join('')})}
function fail(msg){$('#rc').insertAdjacentHTML('beforeend','<div style="color:var(--bad)">'+h(msg)+'</div>')}
async function makePlan(){const r=await post('/api/person/'+P.person.id+'/plan');if(r.error){fail(r.error);return}P.plan=r.plan;render();if(SEL)show(SEL.grp,SEL.i)}
async function dismiss(qid){const r=await post('/api/question/'+qid+'/dismiss');if(r.error){fail(r.error);return}reload()}
function findStep(id){return (P.plan||{steps:[]}).steps.find(s=>s.id===id)||null}
async function revise(id,field,what,val){const s=findStep(id);const rev={...s.revisions};const cur={...(rev[field]||{})};
 if(what==='include'){if(val)delete cur.include;else cur.include=false}else{if(val)cur.value=val;else delete cur.value}
 if(Object.keys(cur).length)rev[field]=cur;else delete rev[field];
 const r=await post('/api/step/'+id+'/revise',{revisions:rev});if(r.error){fail(r.error);return}reload()}
async function logStep(id,outcome){const s=findStep(id);const body={outcome,note:$('#ln-'+id)?.value||'',query:s.query};if(outcome==='found'){body.file=$('#lf-'+id)?.value;if(!body.file){fail('pick the downloaded file in inbox/ first');return}}
 const r=await post('/api/step/'+id+'/log',body);if(r.error){fail(r.error);return}
 await reload();$('#rc').insertAdjacentHTML('afterbegin',`<div style="color:var(--ok)">logged: ${h(outcome)}${r.artifacts&&r.artifacts.length?' · archived '+h(r.artifacts[0].slice(0,12)):''}${r.unparsed?` <span style="color:var(--bad)">· unparsed: ${h(r.unparsed)}</span>`:''}</div>`)}
async function decide(field,status){const r=await post('/api/person/'+P.person.id+'/fact/'+field,{status});if(r.error){fail(r.error);return}await reload();if(status==='accepted'&&r.evidence===0)fail('Nothing to accept: no record behind this fact is held yet. Fetch one, then accept.');
 if(r.answered&&r.answered.length)$('#rc').insertAdjacentHTML('afterbegin',`<div style="color:var(--ok)">answered ${r.answered.length} question(s); plan refreshed</div>`)}
boot();
</script></body></html>
